name: Modbus ARP Scanner tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test protocol parsing and loopback-only devices
        shell: powershell
        run: .\modbus-arp-scanner\tests\Run-Tests.ps1

  powershell-core:
    name: PowerShell 7 on Windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test protocol parsing and loopback-only devices
        shell: pwsh
        run: .\modbus-arp-scanner\tests\Run-Tests.ps1
